[package]
name = "credential-registry"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91.1"
description = "Registro de credenciales del Pasaporte Opportuni (PRD 8.4)"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
